name: Deploy to S3 and Invalidate CloudFront

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  NODE_VERSION: "20"
  AWS_REGION: "ap-southeast-2" # Sydney region - where S3 bucket is located

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          PUBLIC_TRIAL_API_URL: ${{ secrets.PUBLIC_TRIAL_API_URL }}
          PUBLIC_CONTACT_API_URL: ${{ secrets.PUBLIC_CONTACT_API_URL }}
        # Astro automatically optimizes images during build using Sharp
        # Images in src/assets/ are converted to WebP/AVIF
        # Images in public/ are served as-is (not optimized)

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload HTML files to S3 (1 day cache)
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --exclude "*" \
            --include "*.html" \
            --include "*.xml" \
            --include "*.txt" \
            --cache-control "public, max-age=86400, s-maxage=86400" \
            --delete
          # Note: CloudFront invalidation ensures fresh content after deployments
          # 1 day cache is safe since site updates monthly on average
          # CloudFront will automatically compress these files (Brotli/Gzip) if compression is enabled
          # Do NOT pre-compress files - CloudFront handles compression on-the-fly

      - name: Upload CSS files to S3 (1 year cache)
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --exclude "*" \
            --include "*.css" \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "text/css" \
            --delete
          # CloudFront will automatically compress CSS files (Brotli/Gzip) if compression is enabled
          # This reduces bandwidth usage by 20-70% for text-based files

      - name: Upload JavaScript files to S3 (1 year cache)
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --exclude "*" \
            --include "*.js" \
            --include "*.mjs" \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "application/javascript" \
            --delete
          # CloudFront will automatically compress JS files (Brotli/Gzip) if compression is enabled
          # This significantly reduces JavaScript bundle sizes in transit

      - name: Upload WebP images to S3 (1 year cache)
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --exclude "*" \
            --include "*.webp" \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "image/webp" \
            --delete

      - name: Upload AVIF images to S3 (1 year cache)
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --exclude "*" \
            --include "*.avif" \
            --cache-control "public, max-age=31536000, immutable" \
            --content-type "image/avif" \
            --delete

      - name: Upload other images to S3 (1 year cache)
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --exclude "*" \
            --include "*.jpg" \
            --include "*.jpeg" \
            --include "*.png" \
            --include "*.gif" \
            --include "*.svg" \
            --include "*.ico" \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      - name: Upload fonts to S3 (1 year cache)
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --exclude "*" \
            --include "*.woff" \
            --include "*.woff2" \
            --include "*.ttf" \
            --include "*.otf" \
            --cache-control "public, max-age=31536000, immutable" \
            --delete

      - name: Upload other assets to S3 (1 week cache)
        run: |
          aws s3 sync dist/ s3://${{ secrets.S3_BUCKET_NAME }}/ \
            --exclude "*.html" \
            --exclude "*.xml" \
            --exclude "*.txt" \
            --exclude "*.css" \
            --exclude "*.js" \
            --exclude "*.mjs" \
            --exclude "*.webp" \
            --exclude "*.avif" \
            --exclude "*.jpg" \
            --exclude "*.jpeg" \
            --exclude "*.png" \
            --exclude "*.gif" \
            --exclude "*.svg" \
            --exclude "*.ico" \
            --exclude "*.woff" \
            --exclude "*.woff2" \
            --exclude "*.ttf" \
            --exclude "*.otf" \
            --cache-control "public, max-age=604800" \
            --delete

      - name: Verify CloudFront compression is enabled
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            echo "🔍 Checking CloudFront compression configuration..."
            # Get the default cache behavior to check compression settings
            COMPRESS_ENABLED=$(aws cloudfront get-distribution-config \
              --id $CLOUDFRONT_DISTRIBUTION_ID \
              --query 'DistributionConfig.DefaultCacheBehavior.Compress' \
              --output text 2>/dev/null || echo "unknown")
            
            if [ "$COMPRESS_ENABLED" = "true" ]; then
              echo "✅ CloudFront compression is enabled (Brotli/Gzip)"
            elif [ "$COMPRESS_ENABLED" = "false" ]; then
              echo "⚠️  CloudFront compression is DISABLED"
              echo "   Please enable 'Compress objects automatically' in CloudFront distribution settings"
              echo "   See: docs/aws-setup-guide.md for instructions"
            else
              echo "ℹ️  Could not verify compression status (this is OK if distribution is still deploying)"
            fi
          else
            echo "⚠️  CLOUDFRONT_DISTRIBUTION_ID not set, skipping compression check"
          fi

      - name: Invalidate CloudFront cache
        env:
          CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}
        run: |
          if [ -n "$CLOUDFRONT_DISTRIBUTION_ID" ]; then
            echo "🔄 Invalidating CloudFront cache..."
            aws cloudfront create-invalidation \
              --distribution-id $CLOUDFRONT_DISTRIBUTION_ID \
              --paths "/*"
            echo "✅ Cache invalidation initiated"
          else
            echo "⚠️  CLOUDFRONT_DISTRIBUTION_ID not set, skipping cache invalidation"
          fi

      - name: Deployment summary
        run: |
          echo ""
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ Deployment Complete!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "📦 S3 Bucket: ${{ secrets.S3_BUCKET_NAME }}"
          echo "🌐 CloudFront Distribution: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}"
          echo "🚀 Site URL: https://knoxmartialarts.com.au"
          echo ""
          echo "💡 Performance Tips:"
          echo "   • Ensure CloudFront compression is enabled (Brotli/Gzip)"
          echo "   • Check compression status in the verification step above"
          echo "   • See docs/PERFORMANCE-OPTIMIZATION.md for details"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
